repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: bash -c 'cd src/api && dotnet format --verify-no-changes'
        language: system
        files: \.cs$
        pass_filenames: false

      - id: eslint-prettier
        name: eslint + prettier
        entry: bash -c 'cd src/web && pnpm exec eslint . && pnpm exec prettier --check .'
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: commitlint
        name: commitlint
        stages: [commit-msg]
        entry: bash -c 'cd src/web && pnpm exec commitlint --edit "$1"' --
        language: system
