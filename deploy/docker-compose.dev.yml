name: platform-dev

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["natsdata:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  # --- OPTIONAL: enable when the module that needs it arrives ---
  # opensearch:
  #   image: opensearchproject/opensearch:2.17.1
  #   environment: [ "discovery.type=single-node", "DISABLE_SECURITY_PLUGIN=true" ]
  #   ports: ["9200:9200"]
  #   networks: [platform]
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: ["miniodata:/data"]
  #   networks: [platform]

volumes:
  pgdata:
  redisdata:
  natsdata:
  # miniodata:

networks:
  platform:
